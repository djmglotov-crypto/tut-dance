name: Build Android APKs
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-source.zip'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [adults, kids]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Unpack React Native source
        run: unzip -q mobile-source.zip
      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Prepare Android project
        working-directory: mobile
        env:
          APP_VARIANT: ${{ matrix.variant }}
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build standalone APK
        working-directory: mobile/android
        env:
          APP_VARIANT: ${{ matrix.variant }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Name APK
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk tut-dance-${{ matrix.variant }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tut-dance-${{ matrix.variant }}-apk
          path: tut-dance-${{ matrix.variant }}.apk
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-v0.3.0 || gh release create android-v0.3.0 --title "Tut Dance Android 0.3.0 — test builds" --notes "Two standalone React Native Android apps. Motion data and React player are bundled offline. Test builds signed with the development key. Not a Google Play release. Validate audio, camera and recording on your phone." || gh release view android-v0.3.0
          gh release view android-v0.3.0 >/dev/null
          gh release upload android-v0.3.0 tut-dance-${{ matrix.variant }}.apk --clobber
